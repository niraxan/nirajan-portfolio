<!DOCTYPE html>
<html>
<head>
  <title>Nirajan Shrestha Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 10px;
    }

    .slideshow {
      position: relative;
      width: 100%;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .slide.active {
      display: flex;
    }

    .slide img {
      max-width: 70%;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
    }

    .site-title {
      color: white;
      font-size: 28px;
      letter-spacing: 4px;
      text-align: center;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="slideshow">

      <div class="slide active">
        <img src="trailphotos/delusion1.jpg">
      </div>

      <div class="slide">
        <img src="trailphotos/delusion2.jpg">
      </div>

      <div class="slide">
        <img src="trailphotos/delusion3.jpg">
      </div>

      <div class="slide">
        <img src="trailphotos/delusion4.jpg">
      </div>

      <div class="slide">
        <img src="trailphotos/delusion5.jpg">
      </div>

    </div>

    <div class="site-title">
      NIRAJAN SHRESTHA
    </div>

  </div>


  <script>

    let slides = document.querySelectorAll('.slide');
    let current = 0;

    function showSlide(index) {

      slides.forEach(function(slide) {
        slide.classList.remove('active');
      });

      slides[index].classList.add('active');
    }


    // Keyboard

    document.addEventListener('keydown', function(event) {

      if (event.key === "ArrowRight") {

        current = (current + 1) % slides.length;
        showSlide(current);

      }

      if (event.key === "ArrowLeft") {

        current = (current - 1 + slides.length) % slides.length;
        showSlide(current);

      }

    });


    // Automatic slideshow

    setInterval(function() {

      current = (current + 1) % slides.length;
      showSlide(current);

    }, 3000);

  </script>

</body>
</html>
