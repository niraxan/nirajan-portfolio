<!DOCTYPE html>
<html>
<head>
	<title>Nirajan Shrestha Photography</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #f4f0ea;
			font-family: Arial, sans-serif;
			color: #1d1d1d;
			display: flex;
			height: 100vh;
			overflow: hidden;
		}

		/* Left Sidebar Navigation */
		.sidebar {
			width: 280px;
			background: #efeae2;
			border-right: 1px solid #d9d0c5;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 40px 30px;
			height: 100vh;
			overflow-y: auto;
		}

		.sidebar-top h1 {
			font-size: 20px;
			letter-spacing: 2px;
			margin-bottom: 40px;
			font-weight: bold;
			text-transform: uppercase;
			color: #1d1d1d;
		}

		.nav-section {
			margin-bottom: 30px;
		}

		.nav-section h3 {
			font-size: 12px;
			letter-spacing: 2px;
			color: #6b625d;
			text-transform: uppercase;
			margin-bottom: 15px;
		}

		.nav-links {
			list-style: none;
			padding: 0;
			margin: 0;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.nav-links a {
			color: #3c3a38;
			text-decoration: none;
			font-size: 15px;
			transition: color 0.2s ease;
		}

		.nav-links a:hover {
			color: #000;
		}

		.sidebar-footer {
			font-size: 12px;
			color: #6c655f;
		}

		/* Right Main Display Area */
		.main-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			position: relative;
			padding: 20px;
		}

		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			gap: 20px;
		}

		.slideshow {
			position: relative;
			width: 100%;
			height: 80vh;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #f4f0ea;
			overflow: hidden;
		}

		.slide {
			position: absolute;
			width: 100%;
			height: 100%;
			display: none;
			justify-content: center;
			align-items: center;
		}

		.slide.active {
			display: flex;
		}

		.slide img {
			max-width: 85%;
			max-height: 75vh;
			width: auto;
			height: auto;
			object-fit: contain;
			border-radius: 4px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
		}

		/* Mobile adjustments */
		@media (max-width: 768px) {
			body {
				flex-direction: column;
				overflow: auto;
			}
			.sidebar {
				width: 100%;
				height: auto;
				border-right: none;
				border-bottom: 1px solid #222;
				padding: 20px;
			}
			.main-content {
				height: auto;
				min-height: 80vh;
			}
			.slideshow {
				height: 50vh;
			}
		}
	</style>
</head>

<body>

	<!-- LEFT SIDEBAR: Navigation & Links -->
	<nav class="sidebar">
		<div class="sidebar-top">
			<h1>Nirajan Shrestha</h1>

			<div class="nav-section">
				<h3>Projects</h3>
				<ul class="nav-links">
					<li><a href="#sllk">Sllk</a></li>
					<li><a href="#kathmandu">Kathmandu</a></li>
					<li><a href="#tupsyturvy">Tupsyturvy</a></li>
					<li><a href="#working-projects">Working Projects</a></li>
					<li><a href="#journal">Journal</a></li>
				</ul>
			</div>

			<div class="nav-section">
				<h3>Contact</h3>
				<ul class="nav-links">
					<li><a href="mailto:hello@nirajanshrestha.com">Email Me</a></li>
					<li><a href="https://instagram.com" target="_blank" rel="noreferrer">Instagram</a></li>
				</ul>
			</div>
		</div>

		<div class="sidebar-footer">
			&copy; 2026 Nirajan Shrestha
		</div>
	</nav>


	<!-- RIGHT SIDE: Slideshow & Title -->
	<main class="main-content">
		<div class="container">

			<div class="slideshow">
				<div class="slide active">
					<img src="trailphotos/delusion1.jpg" alt="Delusion 1">
				</div>
				<div class="slide">
					<img src="trailphotos/delusion2.jpg" alt="Delusion 2">
				</div>
				<div class="slide">
					<img src="trailphotos/delusion3.jpg" alt="Delusion 3">
				</div>
				<div class="slide">
					<img src="trailphotos/delusion4.jpg" alt="Delusion 4">
				</div>
				<div class="slide">
					<img src="trailphotos/delusion5.jpg" alt="Delusion 5">
				</div>
			</div>

		</div>
	</main>


	<script>
		let slides = document.querySelectorAll('.slide');
		let current = 0;

		function showSlide(index) {
			slides.forEach(function(slide) {
				slide.classList.remove('active');
			});
			slides[index].classList.add('active');
		}

		// Keyboard navigation
		document.addEventListener('keydown', function(event) {
			if (event.key === "ArrowRight") {
				current = (current + 1) % slides.length;
				showSlide(current);
			}
			if (event.key === "ArrowLeft") {
				current = (current - 1 + slides.length) % slides.length;
				showSlide(current);
			}
		});

		// Automatic slideshow
		setInterval(function() {
			current = (current + 1) % slides.length;
			showSlide(current);
		}, 4000);
	</script>

</body>
</html>
